[project]
name = "bhhaccess-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]", "sqlalchemy>=2.0", "alembic", "psycopg2-binary",
  "pydantic-settings", "pyjwt[crypto]", "cryptography", "argon2-cffi",
  "python-multipart", "openpyxl", "qrcode", "pillow", "tzdata", "reportlab>=4.4",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = ["UP046"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in signatures is the framework idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "app.controllers.deps.require", "app.controllers.deps.require_all", "fastapi.File"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501", "I001"]
