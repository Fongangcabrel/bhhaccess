# Internal deployment, one VM: Nginx (HTTPS, PWA) -> API -> PostgreSQL, plus a daily backup.
# No Redis, no cloud. Before the first start: cp .env.example .env (and fill it), put the
# certificate in deploy/certs/ (server.crt + server.key). Then: docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bhhaccess
      POSTGRES_USER: bhh
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhh -d bhhaccess"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      BHH_DATABASE_URL: postgresql+psycopg2://bhh:${DB_PASSWORD}@db:5432/bhhaccess
      BHH_PHOTOS_DIR: /data/photos
      BHH_TRUST_PROXY_HEADERS: "true"  # only Nginx reaches the API: the audit records the real IP
    volumes: [photos:/data/photos]
    depends_on:
      db: {condition: service_healthy}
    expose: ["8000"]  # not published: everything goes through Nginx

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      BHH_SERVER_NAME: ${BHH_SERVER_NAME:?set BHH_SERVER_NAME in .env}
    volumes:
      - ./deploy/nginx/bhhaccess.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      api: {condition: service_healthy}
    ports: ["80:80", "443:443"]

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      TZ: ${BHH_TIMEZONE:-Africa/Douala}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - photos:/data/photos:ro
      - ${BACKUP_DIR:-./backups}:/backups  # copy this folder off the VM (network share, rsync)
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
  photos:
