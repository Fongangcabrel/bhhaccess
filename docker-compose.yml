# Internal deployment: reverse proxy (HTTPS) -> API -> PostgreSQL. No Redis, no cloud.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bhhaccess
      POSTGRES_USER: bhh
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhh -d bhhaccess"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    environment:
      BHH_DATABASE_URL: postgresql+psycopg2://bhh:${DB_PASSWORD}@db:5432/bhhaccess
      BHH_PHOTOS_DIR: /data/photos
    volumes: [photos:/data/photos]  # employee photos, to include in the daily backup
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
volumes:
  pgdata:
  photos:
